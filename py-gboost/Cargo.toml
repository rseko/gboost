[package]
name = "py-gboost"
version = "0.1.0"
edition = "2021"
description = "Python bindings for the gboost gradient boosting library"
license = "MIT"
repository = "https://github.com/rseko/gboost"

[lib]
name = "gboostrs"
crate-type = ["cdylib"]

[dependencies]
gboost = { path = ".." }
numpy = "0.30"
pyo3 = { version = "0.30", features = ["extension-module"] }
