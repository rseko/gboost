[package]
name = "gboost"
version = "0.1.0"
edition = "2024"
description = "Gradient boosting library in Rust"
license = "MIT"
repository = "https://github.com/rseko/gboost"

[dependencies]
anyhow = "1.0"
rand = "0.10"
rayon = "1.12"
zerocopy = { version = "0.8", features = ["std"] }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "benchmark"
harness = false
