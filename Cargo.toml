[package]
name = "gboost"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Gradient boosting library in Rust"
license = "MIT"
repository = "https://github.com/rseko/gboost"

[features]
large-index = []

[dependencies]
anyhow = "1.0"
itertools = "0.15"
num-traits = "0.2"
rand = "0.10"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
zerocopy = { version = "0.8", features = ["std"] }

[dev-dependencies]
criterion = "0.8"
half = { version = "2.7", features = ["num-traits"] }
tempfile = "3"

[[bench]]
name = "benchmark"
harness = false
